<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Tank Sandbox</title><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#151a11">
<style>
:root{--bg:#e9ebdf;--fg:#1c2216;--card:#fff;--line:#c4cab6;--acc:#4b6b2a;--af:#fff;--red:#b3362a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a11;--fg:#e8ecdf;--card:#222a1b;--line:#38432d;--acc:#86ab4a;--af:#10150c;--red:#d9503f}}
:root[data-theme="dark"]{--bg:#151a11;--fg:#e8ecdf;--card:#222a1b;--line:#38432d;--acc:#86ab4a;--af:#10150c;--red:#d9503f}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.scr{display:none;flex:1;min-height:0;flex-direction:column}.scr.on{display:flex}
h1,h2,h3{font-family:Impact,"Arial Narrow Bold",sans-serif;letter-spacing:.02em;margin:0;font-weight:400}
.b{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font:inherit;white-space:nowrap;cursor:pointer}
.b.on{background:var(--acc);color:var(--af);border-color:var(--acc)}
.b:disabled{opacity:.4}
#menu{align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#menu h1{font-size:54px;line-height:.95}
#menu p{margin:0 0 14px;opacity:.75}
.big{width:100%;max-width:320px;padding:18px;font-size:19px;border-radius:12px;font-family:Impact,sans-serif;letter-spacing:.03em}
.top{display:flex;align-items:center;gap:8px;padding:8px}
.top h2{flex:1;font-size:20px}.top .b{padding:8px 9px}
#wrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
canvas#cv{width:min(100%,calc((100dvh - 340px)*1.6));aspect-ratio:8/5;height:auto;touch-action:none;background:#cfe3ee;border-block:1px solid var(--line)}
#msg{padding:4px 10px;min-height:2.6em;font-size:13px;opacity:.9}
.row{display:flex;gap:6px;overflow-x:auto;padding:3px 8px}
.ed{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;padding:4px 8px;font-size:13px}
.ed input{width:100%}
.ed label{display:block}
.fire{margin:6px 8px 8px;background:var(--red);color:#fff;border:0;border-radius:10px;padding:13px;font:22px Impact,sans-serif;letter-spacing:.05em}
#list,#listM,#listT{overflow:auto;padding:0 10px 16px;display:flex;flex-direction:column;gap:12px}.fo{display:none}body.fight .fo{display:inline-block}[hidden]{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.card canvas{width:100%;height:auto;background:#1e2430;border-radius:6px}
.card h3{font-size:20px;margin:6px 0 4px}
.st{display:grid;grid-template-columns:88px 1fr;gap:3px 8px;font-size:12px;align-items:center;margin:6px 0}
.bar{height:7px;background:var(--line);border-radius:4px}.bar i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.card p{margin:4px 0 0;font-size:14px}
</style></head><body>

<div class="scr on" id="menu">
<h1>TANK<br>SANDBOX</h1><p>Balística de tanque en 2D</p>
<button class="b big on" onclick="fight=false;show('sand')">Jugar · modo sandbox</button><button class="b big" onclick="startFight()">Pelea</button>
<button class="b big" onclick="cat('b')">Balas</button><button class="b big" onclick="cat('m')">Materiales</button><button class="b big" onclick="cat('t')">Tanques</button>
</div>

<div class="scr" id="sand">
<div class="top"><button class="b" onclick="show('menu')">←</button><h2></h2><button class="b" id="bd" onclick="toggleDmg()">Daño</button><button class="b" id="bs" onclick="cycSpeed()">1×</button><button class="b" onclick="zoomBy(1/1.4)">−</button><button class="b" onclick="zoomBy(1.4)">+</button><button class="b" onclick="clearAll()">Limpiar</button></div>
<div id="wrap"><canvas id="cv" width="640" height="400"></canvas></div>
<div id="msg">Arrastra en el cielo para apuntar. Toca un objeto para moverlo. Pellizca o usa +/− para zoom. Arrastra el tanque para moverlo.</div>
<div class="row" id="ammoRow"></div>
<div class="row" id="addRow"></div>
<div class="ed">
<label><span id="lg">Grosor</span><input type="range" id="gr" min="5" max="400" step="5" value="100"></label>
<label>Rotación <input type="range" id="ro" min="0" max="359" value="0"></label>
<button class="b" id="del">Borrar</button></div>
<button class="fire" id="fire">¡FUEGO!</button>
</div>

<div class="scr" id="ammo">
<div class="top"><button class="b" onclick="show('menu')">← Menú</button><h2 id="ct">Balas</h2></div>
<div id="list"></div><div id="listM" hidden></div><div id="listT" hidden></div>
</div>

<script>
const SC=.25,W=640,H=400,GY=360,PY=320;let PX=62;
// k: tipo de comportamiento | pen: penetración (mm de acero) | bl/fr: radio de explosión y fragmentos
const A={
AP:{n:'AP · Perforante',pen:220,v:11,g:.05,k:'kin',sp:7,ric:68,ex:0,me:15,c:'#e8e8e8',
d:'Proyectil macizo de acero. Rompe el blindaje solo con energía cinética y suelta esquirlas por detrás de la placa. Rebota si golpea muy inclinado.'},
APDS:{n:'APDS · Núcleo desprendible',pen:380,v:15,g:.04,k:'kin',sp:10,ric:72,ex:0,me:30,c:'#f3f3f3',
d:'Un dardo de tungsteno se separa de su soporte (sabot) al salir del cañón. Más rápido, penetra más y llena el interior de esquirlas.'},
APFSDS:{n:'APFSDS · Dardo aleteado',pen:700,v:19,g:.03,k:'kin',sp:14,ric:78,ex:0,me:40,c:'#ffffff',
d:'Dardo largo y delgado con aletas. Es el que más penetra y casi no rebota. No explota: su daño es el chorro de esquirlas ardientes que genera al perforar.'},
HEAT:{n:'HEAT · Carga hueca',pen:180,v:9,g:.06,k:'heat',bl:55,fr:22,ex:70,me:80,c:'#ffb347',
d:'Un cono de cobre se convierte en un chorro de metal al explotar. Aquí: poca penetración pero explosión y mucha metralla. No rebota: detona al contacto.'},
HE:{n:'HE · Alto explosivo',pen:30,v:9,g:.06,k:'he',bl:110,fr:40,ex:100,me:90,c:'#ff6b4a',
d:'Casco fino lleno de explosivo. Casi no penetra, pero la onda de choque y los fragmentos eliminan personas en un radio grande. Los muros las protegen.'},
HESH:{n:'HESH · Cabeza aplastable',pen:20,v:9,g:.06,k:'hesh',bl:45,fr:6,ex:80,me:70,c:'#ffd27a',
d:'El explosivo plástico se aplasta contra el blindaje y detona. No lo perfora: la onda desprende esquirlas por el lado opuesto y hiere a quien esté detrás.'},
APHE:{n:'APHE · Perforante explosiva',pen:160,v:11,g:.05,k:'kin',fz:1,bl:70,fr:35,sp:5,ric:66,ex:45,me:60,c:'#ffcf6a',
d:'Perforante con una pequeña carga y espoleta retardada: atraviesa el blindaje y estalla del otro lado.'},
SMK:{n:'Humo',pen:0,v:9,g:.06,k:'smk',ex:10,me:0,c:'#dddddd',
d:'Libera una nube de humo al impactar. No hace daño.'},
CAN:{n:'Metralla · Cartucho',pen:22,v:12,g:.08,k:'pel',ric:75,ex:5,me:100,c:'#cfcfcf',
d:'Cartucho de bolas de acero. Al salir del cañón se abre en abanico: letal contra personas a corta distancia, inútil contra blindaje.'}};
{const V=(b,id,n,o)=>{A[id]={...A[b],b,n,...o}};
V('AP','AP2','AP-2 · Reforzada',{pen:300,v:12});V('AP','AP3','AP-3 · Pesada',{pen:400,v:13});
V('APDS','APDS2','APDS-2',{pen:480,v:16});V('APDS','APDS3','APDS-3',{pen:580,v:17});
V('APFSDS','APFSDS2','APFSDS-2',{pen:850,v:21});V('APFSDS','APFSDS3','APFSDS-3 · Uranio',{pen:1000,v:23});
V('HEAT','HEAT2','HEAT-2',{pen:260,bl:65,fr:28});V('HEAT','HEAT3','HEAT-3 · Tándem',{pen:360,bl:75,fr:34});
V('HE','HE2','HE-2',{pen:50,bl:140,fr:55});V('HE','HE3','HE-3 · Termobárica',{pen:70,bl:170,fr:70});
V('HESH','HESH2','HESH-2',{pen:30,bl:60,fr:8});V('APHE','APHE2','APHE-2',{pen:220,bl:85,fr:45})}
const M={acero:{n:'Acero',f:1,c:'#7d8793'},hormigon:{n:'Hormigón',f:.3,c:'#a3a39b'},madera:{n:'Madera',f:.07,c:'#a8743f'},ladrillo:{n:'Ladrillo',f:.2,c:'#b05a40'},persona:{n:'Persona',f:.05,c:'#3b6ea5'},aluminio:{n:'Aluminio',f:.4,c:'#b9c4cf'},forro:{n:'Forro antiesquirlas',f:.03,c:'#c9b458'},municion:{n:'Munición',f:.12,c:'#b8862b'},motor:{n:'Motor',f:.2,c:'#4a4f57'}};
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d');
let fight=false,hp=100,drv=0,aiOn=false,cmax=25,noSh=false,tdrag=null,lb=[],bo=[],ch=[],cam={z:1,x:0,y:0},ptr=new Map(),pinch=null,run=false,objs=[],pr=[],fr=[],pa=[],fx=[],sel=null,drag=null,aiming=false,aim=.22,recoil=0,cur='AP',cool=0;

function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id));run=id=='sand';document.body.classList.toggle('fight',fight&&run);if(!fight){cam.x=0;clampCam()}}
const wpx=o=>Math.max(o.mm*SC,2);
function loc(o,x,y){const c=Math.cos(o.a),s=Math.sin(o.a),dx=x-o.x,dy=y-o.y;return[dx*c+dy*s,-dx*s+dy*c]}
function inside(o,x,y,m=0){const[l,k]=loc(o,x,y);return Math.abs(l)<=wpx(o)/2+m&&Math.abs(k)<=o.h/2+m}
const live=o=>!(o.t=='persona'&&!o.alive);
function add(t,x,y,mm,a=0){const o={t,x:x??(fight?PX+300:380)+Math.random()*120,y:y??(t=='persona'?GY-22:GY-50),a,mm:mm??(t=='persona'?50:100),h:t=='persona'?44:100,holes:[],alive:true,heat:0,dmg:0,cr:Array.from({length:7},()=>[Math.random()-.5,Math.random()-.5,Math.random()-.5,Math.random()-.5])};objs.push(o);sel=o;sync();return o}
function clearAll(){objs=[];pr=[];fr=[];pa=[];fx=[];ch=[];sel=null;sync();msg('Escenario vacío. Agrega objetos abajo.')}
function msg(t){$('#msg').textContent=t}

// UI
for(const k in A){const b=document.createElement('button');b.className='b'+(k==cur?' on':'');b.textContent=k=='SMK'?'Humo':k=='CAN'?'Metralla':k;b.onclick=()=>{cur=k;document.querySelectorAll('#ammoRow .b').forEach(e=>e.classList.toggle('on',e==b));msg(A[k].n+(A[k].pen?' · penetración '+A[k].pen+' mm':''))};$('#ammoRow').append(b)}
for(const k in M){const b=document.createElement('button');b.className='b';b.textContent='+ '+M[k].n;b.onclick=()=>add(k);$('#addRow').append(b)}
for(const[t,d]of[['Tanque ▶',18],['◀ Tanque',-18]]){const b=document.createElement('button');b.className='b';b.textContent=t;b.onclick=()=>{PX=clp(PX+d)};$('#addRow').prepend(b)}
for(const n of['Maus','Leopard','T-34','Sherman']){const b=document.createElement('button');b.className='b';b.textContent='+ Tanque '+n;b.onclick=()=>addTank(n);$('#addRow').prepend(b)}
const mk=(t,f,id)=>{const b=document.createElement('button');b.className='b fo';b.textContent=t;if(id)b.id=id;b.onclick=f;$('#addRow').prepend(b);return b};
mk('Reiniciar',()=>restart());mk('IA ataca: NO',()=>{aiOn=!aiOn;$('#ai').textContent='IA ataca: '+(aiOn?'SÍ':'NO')},'ai');mk('+ Enemigo',()=>spawn());
for(const[t,d]of[['Mover ▶',1],['◀ Mover',-1]]){const b=mk(t,null);b.style.touchAction='none';b.onpointerdown=()=>drv=d;b.onpointerup=b.onpointerleave=b.onpointercancel=()=>drv=0}
const gr=$('#gr'),ro=$('#ro'),del=$('#del');
function sync(){const on=!!sel;gr.disabled=ro.disabled=del.disabled=!on;if(on){gr.value=sel.mm;ro.value=Math.round(((sel.a*180/Math.PI)%360+360)%360)}$('#lg').textContent=on?(sel.nm||M[sel.t].n)+': '+Math.round(sel.mm)+' mm':'Toca un objeto para editarlo'}
gr.oninput=()=>{if(sel){sel.mm=+gr.value;sync()}};
ro.oninput=()=>{if(sel)sel.a=ro.value*Math.PI/180};
del.onclick=()=>{objs=objs.filter(o=>o!=sel);sel=null;sync()};
$('#fire').onclick=fire;

// Entrada
function scr(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
function pos(e){const[x,y]=scr(e);return[x/cam.z+cam.x,y/cam.z+cam.y]}
function clampCam(){if(!fight)cam.x=Math.max(0,Math.min(W-W/cam.z,cam.x));cam.y=Math.max(0,Math.min(H-H/cam.z,cam.y))}
function zoomAt(z,sx,sy){z=Math.max(1,Math.min(4,z));const wx=sx/cam.z+cam.x,wy=sy/cam.z+cam.y;cam.z=z;cam.x=wx-sx/z;cam.y=wy-sy/z;clampCam()}
function zoomBy(f){zoomAt(cam.z*f,W/2,H/2)}
function startPinch(){const[a,b]=[...ptr.values()],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:cam.z,wx:mx/cam.z+cam.x,wy:my/cam.z+cam.y}}
function movePinch(){if(!pinch)return;const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),z=Math.max(1,Math.min(4,pinch.z*d/Math.max(pinch.d,1)));cam.z=z;cam.x=pinch.wx-(a[0]+b[0])/2/z;cam.y=pinch.wy-(a[1]+b[1])/2/z;clampCam()}
cv.onwheel=e=>{e.preventDefault();const[x,y]=scr(e);zoomAt(cam.z*(e.deltaY<0?1.15:.87),x,y)};
function setAim(x,y){aim=Math.max(-.1,Math.min(1.2,Math.atan2(PY-y,x-PX)))}
cv.onpointerdown=e=>{const[x,y]=pos(e);cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,scr(e));if(ptr.size==2){drag=null;aiming=false;sel=null;sync();startPinch();return}if(Math.abs(x-PX)<46&&y>GY-52&&y<GY+6&&!objs.some(o=>inside(o,x,y,6))){tdrag=x-PX;sel=null;sync();return}let f=null;for(let i=objs.length-1;i>=0;i--)if(inside(objs[i],x,y,10)){f=objs[i];break}
if(f){sel=f;drag=[f.x-x,f.y-y]}else{sel=null;aiming=true;setAim(x,y)}sync()};
cv.onpointermove=e=>{if(ptr.has(e.pointerId))ptr.set(e.pointerId,scr(e));if(ptr.size==2){movePinch();return}const[x,y]=pos(e);if(tdrag!=null){PX=clp(x-tdrag);return}if(drag&&sel){const nx=(fight?x+drag[0]:Math.max(0,Math.min(W,x+drag[0]))),ny=Math.max(20,Math.min(GY,y+drag[1])),dx=nx-sel.x,dy=ny-sel.y;for(const o of objs)if(o==sel||(sel.g&&o.g==sel.g)){o.x+=dx;o.y+=dy}}else if(aiming)setAim(x,y)};
cv.onpointerup=cv.onpointercancel=e=>{ptr.delete(e.pointerId);pinch=null;drag=null;tdrag=null;aiming=false};

// Disparo
function fire(){if(cool>0||(fight&&hp<=0))return;cool=cmax=fight?Math.round(Math.min(260,90+(A[cur].pen||200)/6)):25;const a=A[cur],dx=Math.cos(aim),dy=-Math.sin(aim),mx=PX+dx*55,my=PY+dy*55;recoil=7;
const n=cur=='CAN'?14:1;for(let i=0;i<n;i++){const s=n>1?(Math.random()-.5)*.36:0,v=a.v*(n>1?.85+Math.random()*.3:1),c=Math.cos(s),sn=Math.sin(s);
pr.push({id:cur,x:mx,y:my,qx:mx,qy:my,vx:(dx*c-dy*sn)*v,vy:(dx*sn+dy*c)*v,pen:a.pen,ign:new Set()})}
for(let i=0;i<8;i++)pa.push({x:mx,y:my,vx:dx*3+(Math.random()-.5)*2,vy:dy*3+(Math.random()-.5)*2,l:0,m:25,c:'120,120,120',r:3});
fx.push({x:mx,y:my,r:0,m:18,l:0})}

// Efectos
function frags(x,y,n,ang,spr,v0,v1){if(n>=12){lb.push({x,y:y-14,t:'metralla ×'+n,l:0});fx.push({x,y,r:0,m:n*1.1,l:4})}for(let i=0;i<n;i++){const a=ang+(Math.random()*2-1)*spr,v=v0+Math.random()*(v1-v0);fr.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:0})}}
function shielded(x,y,tx,ty){if(noSh)return false;const d=Math.hypot(tx-x,ty-y),n=Math.ceil(d/4);for(let i=1;i<n;i++){const px=x+(tx-x)*i/n,py=y+(ty-y)*i/n;for(const o of objs)if(o.t!='persona'&&inside(o,px,py))return true}return false}
function blast(x,y,r,n){fx.push({x,y,r:0,m:r,l:0});chunks(x,y,Math.round(n/2)+4,0,Math.PI,'#59616b',3,10,.9);for(const o of objs){const d=Math.hypot(o.x-x,o.y-y);if(o.t=='persona'){if(o.alive&&d<r&&!shielded(x,y,o.x,o.y))o.alive=false}else if(d<r*1.2){const k=1-d/(r*1.2);strain(o,r*.5*k,k*r/80)}}
frags(x,y,n,0,Math.PI,5,12);for(let i=0;i<10;i++)pa.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*3,l:0,m:40,c:'90,90,90',r:4})}
function smoke(x,y){for(let i=0;i<60;i++)pa.push({x:x+(Math.random()-.5)*20,y:y+(Math.random()-.5)*10,vx:(Math.random()-.5)*1.6,vy:-Math.random()*1.2,l:0,m:260+Math.random()*100,c:'225,225,225',r:8,gr:.06})}
function sparks(x,y,n,c='255,200,80'){for(let i=0;i<n;i++)pa.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:0,m:14,c,r:2})}
function chunks(x,y,n,ang,spr,col,v0,v1,hot){for(let i=0;i<n;i++){const a=ang+(Math.random()*2-1)*spr,v=v0+Math.random()*(v1-v0);ch.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,a:Math.random()*6,va:(Math.random()-.5)*.5,s:2.5+Math.random()*4,c:col,hot,l:0})}if(ch.length>260)ch=ch.slice(-260)}
function strain(o,en,heat){o.heat=Math.min(1.6,(o.heat||0)+heat);if(o.t!='acero'&&o.t!='persona')o.dmg+=en/(o.mm*M[o.t].f+20)}
function wp(o,lx,ly){const c=Math.cos(o.a),s=Math.sin(o.a);return[o.x+lx*c-ly*s,o.y+lx*s+ly*c]}
function flame(o,col,up){if(pa.length>1500)return;const[x,y]=wp(o,(Math.random()-.5)*wpx(o),-o.h/2*(.6+Math.random()*.4));pa.push({x,y,vx:(Math.random()-.5)*.6,vy:-up-Math.random(),l:0,m:34,c:col,r:4,gr:-.08})}
function drop(o){const[x,y]=wp(o,(Math.random()-.5)*wpx(o),o.h/2);pa.push({x,y,vx:0,vy:1+Math.random(),l:0,m:40,c:'255,150,40',r:2.5})}
function shatter(o){objs=objs.filter(x=>x!=o);if(sel==o){sel=null;sync()}const b=o.fire||o.melt;if(!b)chunks(o.x,o.y,10+Math.round(o.mm/20),-Math.PI/2,Math.PI,M[o.t].c,2,8,.2);for(let i=0;i<14;i++)pa.push({x:o.x+(Math.random()-.5)*wpx(o),y:o.y+(Math.random()-.5)*o.h,vx:(Math.random()-.5)*3,vy:-Math.random()*2,l:0,m:50,c:b?'60,60,60':'150,150,140',r:5,gr:.1});msg(M[o.t].n+(o.fire?' se quemó por completo.':o.melt?' se derritió.':' se rompió en pedazos.'))}
function mini(g,p){const id=p.id;g.save();g.translate(p.x,p.y);g.rotate(Math.atan2(p.vy,p.vx));g.scale(1.4,1.4);
if(id=='CAN'){g.fillStyle='#d0d0d0';g.beginPath();g.arc(0,0,1.6,0,7);g.fill();g.restore();return}
const[c,L,r]={AP:['#7b8590',16,3.5],APDS:['#2b2f36',18,2],APFSDS:['#22262d',26,1.7],HEAT:['#d9473a',16,4],HE:['#c9382c',16,4],HESH:['#e8a23a',14,4.3],APHE:['#7b8590',16,3.5],SMK:['#d8d8d8',16,4]}[id];
